<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ADHD 与神经多样性自测矩阵</title>
<style>
  :root {
    --p: #6E8C4D;
    --p-dark: #4C6530;
    --p-light: #EEF3E4;
    --bg: #EDF2E6;
    --card: #ffffff;
    --t: #1f2430;
    --t2: #5c6470;
    --t3: #9aa1ac;
    --bd: #e6e9ef;
    --ok: #2e9e5b;
    --warn: #b8860b;
    --danger: #b3261e;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--t);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 600px; margin: 0 auto; min-height: 100vh; padding: 0 16px; display: flex; flex-direction: column; }

  /* ============ 通用 ============ */
  .screen { display: none; flex: 1; flex-direction: column; padding-bottom: 32px; }
  .screen.active { display: flex; }
  .card {
    background: var(--card); border-radius: var(--radius);
    padding: 22px 18px; box-shadow: 0 2px 12px rgba(31,36,48,.05);
  }
  .btn {
    display: block; width: 100%; border: none; border-radius: 14px;
    padding: 16px; font-size: 17px; font-weight: 600; font-family: inherit;
    cursor: pointer; text-align: center; transition: transform .1s ease;
  }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--p); color: #fff; }
  .btn-outline { background: #fff; color: var(--p); border: 2px solid var(--p); }
  .btn-ghost { background: transparent; color: var(--t3); font-size: 14px; padding: 12px; }
  .btn-link {
    display: block; width: 100%; text-align: center; text-decoration: none;
    background: linear-gradient(135deg, #F5A623, #E07B1A);
    color: #fff; border-radius: 14px; padding: 16px;
    font-size: 17px; font-weight: 600;
  }
  .btn-row { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .muted { color: var(--t2); }
  .small { font-size: 13px; }

  /* ============ 首页 ============ */
  .home-head { padding: 26px 0 6px; }
  .home-head h1 { font-size: 24px; letter-spacing: -.3px; }
  .home-head p { font-size: 13.5px; color: var(--t2); margin-top: 4px; }
  .home-progress { margin: 16px 0 6px; }
  .progress-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 13.5px; color: var(--t2); margin-bottom: 7px; }
  .progress-row strong { color: var(--t); font-size: 15px; }
  .bar { height: 7px; background: var(--bd); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--p), #9CB27C); border-radius: 999px; transition: width .3s ease; }

  .tabs {
    display: flex; gap: 8px; overflow-x: auto; padding: 14px 0 4px;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto; border: 1px solid var(--bd); background: #fff;
    color: var(--t2); font-family: inherit; font-size: 14px; font-weight: 500;
    padding: 9px 15px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    transition: all .15s;
  }
  .tab.active { background: var(--p); border-color: var(--p); color: #fff; font-weight: 600; }

  .entry-list { display: flex; flex-direction: column; gap: 12px; margin: 14px 0 8px; }
  .entry {
    background: var(--card); border: 2px solid transparent; border-radius: var(--radius);
    padding: 16px; text-align: left; width: 100%; font-family: inherit; color: inherit;
    box-shadow: 0 2px 10px rgba(31,36,48,.05); cursor: pointer; transition: transform .1s;
  }
  .entry:active { transform: scale(.988); }
  .entry-top { display: flex; align-items: flex-start; gap: 12px; }
  .entry-icon {
    width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; font-size: 22px;
  }
  .entry-main { flex: 1; min-width: 0; }
  .entry-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .entry-desc { font-size: 12.5px; color: var(--t2); margin-top: 2px; }
  .entry-note { font-size: 12px; color: var(--t3); margin-top: 6px; }
  .entry-summary { font-size: 12.5px; color: var(--t); margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--bd); font-weight: 600; }
  .entry-right { flex-shrink: 0; text-align: right; }
  .badge { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; background: var(--bg); color: var(--t3); white-space: nowrap; }
  .badge.done { background: #e9f8ef; color: var(--ok); font-weight: 600; }
  .badge.doing { background: #fff7e6; color: var(--warn); font-weight: 600; }
  .view-link { display: inline-block; font-size: 12px; color: var(--p); font-weight: 600; text-decoration: underline; margin-top: 4px; }

  .comp-entry {
    background: linear-gradient(135deg, #6E8C4D, #7E965A); color: #fff;
    border-radius: var(--radius); padding: 18px; width: 100%; text-align: left;
    font-family: inherit; border: none; cursor: pointer; margin-top: 4px;
  }
  .comp-entry .entry-title, .comp-entry .entry-desc { color: #fff; }
  .comp-entry .entry-desc { opacity: .88; }
  .comp-entry .badge { background: rgba(255,255,255,.2); color: #fff; }
  .foot-note { text-align: center; font-size: 11.5px; color: var(--t3); margin: 14px 0 4px; }

  /* ============ 引导页 ============ */
  .guide-head { text-align: center; padding: 22px 0 6px; }
  .guide-head .em { font-size: 46px; }
  .guide-head h2 { font-size: 21px; margin-top: 8px; }
  .guide-tag { text-align: center; font-size: 12.5px; color: var(--p); margin: 4px 0 14px; }
  .info-grid { display: flex; gap: 10px; margin-bottom: 14px; }
  .info-cell { flex: 1; background: #fff; border-radius: 12px; padding: 11px 6px; text-align: center; box-shadow: 0 1px 6px rgba(31,36,48,.04); }
  .info-cell .num { font-size: 18px; font-weight: 700; color: var(--p-dark); }
  .info-cell .lb { font-size: 11.5px; color: var(--t2); }
  .guide-body { font-size: 14.5px; color: var(--t2); }
  .guide-body p { margin-bottom: 10px; }
  .guide-body strong { color: var(--t); }
  .guide-point { display: flex; gap: 9px; align-items: flex-start; background: var(--p-light); border-radius: 11px; padding: 11px 13px; margin: 10px 0; font-size: 13.5px; color: var(--t); }
  .guide-point.warn { background: #fdf6e3; }
  .guide-point .ic { flex-shrink: 0; }

  /* ============ 答题页 ============ */
  .topbar { position: sticky; top: 0; background: var(--bg); padding: 14px 0 10px; z-index: 20; }
  .topbar .progress-row { margin-bottom: 7px; }
  .q-card { margin-top: 6px; }
  .q-index { font-size: 12.5px; color: var(--t3); margin-bottom: 5px; }
  .q-text { font-size: 18.5px; font-weight: 600; line-height: 1.55; }
  .q-hint { margin-top: 9px; font-size: 12.5px; color: var(--warn); background: #fdf6e3; border-radius: 9px; padding: 8px 11px; }
  .q-ex { margin-top: 9px; font-size: 12.5px; color: var(--t3); background: var(--bg); border-left: 3px solid var(--bd); border-radius: 0 8px 8px 0; padding: 8px 11px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 11px; }
  .opt {
    width: 100%; min-height: 62px; padding: 15px 18px; font-size: 16.5px; font-weight: 500;
    font-family: inherit; color: var(--t); background: #fff; border: 2px solid var(--bd);
    border-radius: 13px; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 11px;
    transition: border-color .15s, background .15s;
  }
  .opt .dot { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--bd); flex-shrink: 0; transition: all .15s; }
  .opt.picked { border-color: var(--p); background: var(--p-light); }
  .opt.picked .dot { border-color: var(--p); background: var(--p); }
  .back-line { margin-top: 14px; }
  .back-btn { background: none; border: none; color: var(--t3); font-size: 14px; font-family: inherit; padding: 6px 0; cursor: pointer; }

  /* ============ 结果页 ============ */
  .res-head { text-align: center; padding: 24px 0 4px; }
  .res-head .em { font-size: 50px; }
  .res-head h2 { font-size: 22px; margin: 8px 0 4px; }
  .res-score { text-align: center; font-size: 15px; color: var(--t2); margin-bottom: 16px; }
  .res-score strong { font-size: 30px; color: var(--t); font-weight: 700; }
  .interpret { font-size: 14px; color: var(--t2); }
  .interpret p { margin: 9px 0; }
  .interpret strong { color: var(--t); }
  .dim { background: var(--bg); border-radius: 10px; padding: 11px 13px; margin: 10px 0; }
  .dim-row { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 6px; }
  .dim-bar { height: 6px; background: #e2e6ee; border-radius: 999px; overflow: hidden; }
  .dim-fill { height: 100%; background: var(--p); border-radius: 999px; }
  .quote-box {
    background: #fdf6e3; border-radius: 11px; padding: 12px 14px;
    font-size: 13px; color: #7a5c00; margin: 16px 0 6px; line-height: 1.65;
  }
  .disclaim {
    background: #fff3f3; border: 1px solid #ffd6d6; border-radius: 11px;
    padding: 12px 14px; font-size: 13px; color: var(--danger);
    display: flex; gap: 9px; align-items: flex-start; margin: 14px 0;
  }
  .disclaim .ic { flex-shrink: 0; }

  /* ============ 综合报告 ============ */
  .report-head { text-align: center; padding: 24px 0 8px; }
  .report-head .em { font-size: 46px; }
  .report-head h2 { font-size: 21px; margin-top: 6px; }
  .report-head p { font-size: 13px; color: var(--t2); margin-top: 4px; }
  .sec { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 8px rgba(31,36,48,.04); }
  .sec-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .sec p { font-size: 13.5px; color: var(--t2); margin: 7px 0; }
  .sec strong { color: var(--t); }
  .sec.alert { background: #fff8e6; border: 1px solid #ffe6b0; }
  .sec.alert .sec-title { color: #8a6100; }
  .sec.safe { background: #DCE9C9; border: 1px solid #A3BC82; }
  /* 报告层级配色：终极综合报告（深抹茶绿）> 模块汇总报告（浅抹茶绿，低一级） */
  #s-comp .sec   { background: #DCE9C9; border: 1px solid #B9CF9C; }
  #s-tabrep .sec { background: #EAF1DA; border: 1px solid #D3E1BE; }
  #s-comp .sec.alert, #s-tabrep .sec.alert { background: #fff8e6; border-color: #ffe6b0; }
  #s-comp .sec.safe,  #s-tabrep .sec.safe  { background: #CBE0B6; border-color: #A3BC82; }
  .mini-tag { display: inline-block; font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--p-light); color: var(--p-dark); margin-right: 5px; }
  .author { text-align: center; font-size: 13px; color: var(--t2); margin: 18px 0 8px; }
  .soft-ad { font-size: 13px; color: var(--t2); background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; line-height: 1.7; }

  /* ============ 模块汇总报告入口 ============ */
  .tab.full { border-color: #B8C6A2; color: var(--p-dark); font-weight: 600; }
  .tab-report {
    background: #fff; border: 2px dashed var(--bd); border-radius: var(--radius);
    padding: 14px 15px; width: 100%; text-align: left; font-family: inherit; color: inherit;
    cursor: pointer; display: flex; align-items: center; gap: 12px; margin-top: 2px;
    transition: transform .1s;
  }
  .tab-report:active { transform: scale(.988); }
  .tab-report.unlocked {
    background: linear-gradient(135deg, #EEF3E4, #F5F7EB);
    border: 2px solid var(--p); box-shadow: 0 3px 14px rgba(79,110,247,.14);
  }
  .tab-report .tr-icon {
    width: 40px; height: 40px; flex-shrink: 0; border-radius: 11px;
    display: flex; align-items: center; justify-content: center; font-size: 19px;
    background: var(--bg);
  }
  .tab-report.unlocked .tr-icon { background: #fff; }
  .tab-report .tr-main { flex: 1; min-width: 0; }
  .tab-report .tr-title { font-size: 15px; font-weight: 700; }
  .tab-report .tr-desc { font-size: 12px; color: var(--t2); margin-top: 2px; }
  .tab-report .tr-badge {
    flex-shrink: 0; font-size: 11.5px; padding: 4px 10px; border-radius: 999px;
    background: var(--bg); color: var(--t3); white-space: nowrap;
  }
  .tab-report.unlocked .tr-badge { background: var(--p); color: #fff; font-weight: 600; }
  .tr-mini-bar { height: 4px; background: #e2e6ee; border-radius: 999px; overflow: hidden; margin-top: 7px; }
  .tr-mini-fill { height: 100%; background: var(--p); border-radius: 999px; }

  /* 结果页的本模块已解锁提示 */
  .tab-unlock-note {
    width: 100%; display: flex; align-items: center; gap: 10px; text-align: left;
    background: linear-gradient(135deg, #EEF3E4, #F5F7EB); border: 1px solid #D3DEC4;
    border-radius: 12px; padding: 13px 14px; margin-top: 14px; font-family: inherit;
    color: var(--t); cursor: pointer;
  }
  .tab-unlock-note .ic { flex-shrink: 0; font-size: 20px; }
  .tab-unlock-note .tx { flex: 1; min-width: 0; }
  .tab-unlock-note .t1 { font-size: 13.5px; font-weight: 700; }
  .tab-unlock-note .t2 { font-size: 12px; color: var(--t2); margin-top: 1px; }
  .tab-unlock-note .go { flex-shrink: 0; font-size: 12.5px; font-weight: 700; color: var(--p); }

  /* 综合报告顶部的模块报告导航 */
  .chip-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 2px 0 12px; }
  .chip {
    flex: 0 0 auto; font-family: inherit; font-size: 12.5px; padding: 7px 12px;
    border-radius: 999px; border: 1px solid #D3DEC4; background: #fff;
    color: var(--p-dark); cursor: default; white-space: nowrap;
  }

  /* 报告内的数据行 / 缺失清单 */
  .stat-row {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    padding: 9px 0; border-bottom: 1px dashed var(--bd); font-size: 12.5px;
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .sr-name { color: var(--t); flex: 1; min-width: 0; }
  .stat-row .sr-val { color: var(--t2); text-align: right; flex-shrink: 0; max-width: 62%; }
  .miss-row {
    display: flex; justify-content: space-between; gap: 10px;
    font-size: 13px; padding: 8px 0; border-bottom: 1px dashed var(--bd);
  }
  .miss-row:last-child { border-bottom: none; }
  .miss-row span { color: var(--t3); flex-shrink: 0; }
/* ===== 访问门禁 ===== */
.gate {
  position: fixed;
  inset: 0;
  height: 100dvh;      /* 铺满动态视口，规避 iOS 地址栏/键盘导致的上下留白 */
  overflow-y: auto;    /* 小屏或键盘弹出时卡片可滚动，按钮不会被顶出屏幕 */
  z-index: 9999;
  background: var(--bg);
  display: flex;
}
.gate-card {
  background: #fff;
  border-radius: 20px;
  padding: 44px 40px;
  width: min(340px, calc(100vw - 32px));  /* 极窄屏自适应，避免横向溢出 */
  margin: auto;                            /* 居中；内容超出时能正常滚到顶部 */
  text-align: center;
  box-shadow: 0 12px 40px rgba(31,36,48,.12);
}
.gate-emoji { font-size: 44px; }
.gate-title { font-size: 22px; font-weight: 700; color: var(--t); margin: 12px 0 4px; }
.gate-sub { font-size: 14px; color: var(--t2); margin-bottom: 22px; }
#gate-input {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  border: 1px solid var(--bd);
  border-radius: 12px;
  text-align: center;
  letter-spacing: 2px;
  outline: none;
  font-family: inherit;
}
#gate-input:focus { border-color: var(--p); }
.gate-btn {
  width: 100%;
  margin-top: 14px;
  padding: 14px;
  font-size: 16px;
  font-weight: 600;
  color: #fff;
  background: var(--p);
  border: none;
  border-radius: 12px;
  cursor: pointer;
}
.gate-error { margin-top: 12px; font-size: 13px; color: var(--danger); min-height: 18px; }
/* ===== 微信端报告图片保存 ===== */
.img-save-mask {
  position: fixed; inset: 0; z-index: 10000; background: rgba(0,0,0,.72);
  display: flex; align-items: center; justify-content: center; padding: 18px;
}
.img-save-card {
  background: #fff; border-radius: 16px; padding: 16px; width: 100%;
  max-width: 420px; max-height: 92vh; overflow: auto; text-align: center;
}
.img-save-card img { width: 100%; border-radius: 8px; display: block; }
.img-save-hint { font-size: 13px; color: #5c6470; margin: 12px 0 6px; line-height: 1.7; }
.img-save-close { margin-top: 10px; width: 100%; padding: 13px; background: var(--p); color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer; }
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-emoji">🔒</div>
    <div class="gate-title">ADHD 综合自测</div>
    <div class="gate-sub">请输入访问密码</div>
    <input type="password" id="gate-input" placeholder="访问密码" autocomplete="off">
    <button class="gate-btn" id="gate-btn">进入</button>
    <div class="gate-error" id="gate-error"></div>
  </div>
</div>
<div class="app">

  <!-- ================= 首页 ================= -->
  <div class="screen active" id="s-home">
    <div class="home-head">
      <h1>ADHD 与神经多样性自测矩阵</h1>
      <p>14 个独立量表 · 四大模块 · 逐题自动存档</p>
    </div>
    <div class="home-progress" id="home-progress"></div>
    <div class="tabs" id="tabs"></div>
    <div class="entry-list" id="entry-list"></div>
    <div id="comp-slot"></div>
    <button class="btn btn-outline" onclick="showReportImage()" style="margin-top:12px;">结果保存为图片</button>
    <p class="foot-note">所有量表仅作自我了解与初筛参考，不能替代专业诊断。</p>
    <button class="btn btn-ghost" onclick="resetTest()" style="margin-top:8px;">重新测试</button>
  </div>

  <!-- ================= 引导页 ================= -->
  <div class="screen" id="s-guide">
    <div class="guide-head">
      <div class="em" id="g-em">📋</div>
      <h2 id="g-title"></h2>
    </div>
    <div class="guide-tag" id="g-tag"></div>
    <div class="info-grid" id="g-info"></div>
    <div class="card guide-body" id="g-body"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="g-start">开始测试</button>
      <button class="btn btn-ghost" id="g-retest" style="display:none;">重新测试</button>
      <button class="btn btn-ghost" onclick="showHome()">← 返回首页</button>
    </div>
  </div>

  <!-- ================= 答题页 ================= -->
  <div class="screen" id="s-quiz">
    <div class="topbar">
      <div class="progress-row">
        <span id="q-mname"></span>
        <span>第 <strong id="q-cur">1</strong> 题 / 共 <strong id="q-total">18</strong> 题</span>
      </div>
      <div class="bar"><div class="bar-fill" id="q-bar"></div></div>
    </div>
    <div class="card q-card">
      <div class="q-index" id="q-index"></div>
      <div class="q-text" id="q-text"></div>
      <div class="q-hint" id="q-hint" style="display:none"></div>
      <div class="q-ex" id="q-ex" style="display:none"></div>
      <div class="options" id="options"></div>
    </div>
    <div class="back-line"><button class="back-btn" id="q-back" onclick="goBack()">← 上一题</button></div>
  </div>

  <!-- ================= 单项结果页 ================= -->
  <div class="screen" id="s-result">
    <div class="res-head">
      <div class="em" id="r-em">📋</div>
      <h2 id="r-title"></h2>
    </div>
    <div class="res-score" id="r-score"></div>
    <div class="card">
      <div class="interpret" id="r-interpret"></div>
    </div>
    <div id="r-tabnote"></div>
    <div class="disclaim">
      <div class="ic">⚠️</div>
      <div>本测试仅作初筛参考，不能替代专业医生的临床诊断。</div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="r-next">下一个测试</button>
      <button class="btn btn-outline" onclick="showHome()">返回首页</button>
      <button class="btn btn-ghost" id="r-retry">重新测试</button>
    </div>

/* =====================================================================
 * 3. 状态管理（localStorage + 内存兜底）
 * 存档结构：
 *   answers   { 模块id: [逐题答案] }
 *   results   { 模块id: { score, max, pct, done, time, detail } }
 *   tabReports{ Tabid: { unlocked, viewed, time } }   ← 模块汇总报告状态
 *   tab       当前停留的 Tab
 * ===================================================================== */
const EMPTY_STATE = { answers: {}, results: {}, tabReports: {}, tab: "core" };
let memory = null;

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const s = Object.assign({}, EMPTY_STATE, JSON.parse(raw));
      s.tabReports = s.tabReports || {};
      return s;
    }
  } catch (e) {}
  return memory ? JSON.parse(JSON.stringify(memory)) : JSON.parse(JSON.stringify(EMPTY_STATE));
}
function saveState() {
  syncTabReports();                  // 每次落盘前校准各 Tab 的解锁状态
  memory = JSON.parse(JSON.stringify(state));
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}
let state = loadState();
if (!state.tabReports) state.tabReports = {};

function byId(id) { return MODULES.find(m => m.id === id); }
function answersOf(mod) {
  if (!state.answers[mod.id]) state.answers[mod.id] = new Array(mod.items.length).fill(null);
  return state.answers[mod.id];
}
function firstUnanswered(mod) {
  const a = answersOf(mod);
  for (let i = 0; i < a.length; i++) if (a[i] == null) return i;
  return a.length - 1;
}
function answeredCount(mod) { return answersOf(mod).filter(v => v != null).length; }
/* 当前模块（Tab）内，紧跟在 mod 之后的那个测试；已是最后一个则返回 null */
function nextInModule(mod) {
  const list = tabModules(mod.tab);
  const idx = list.findIndex(m => m.id === mod.id);
  return (idx >= 0 && idx < list.length - 1) ? list[idx + 1] : null;
}
function isLastInModule(mod) {
  const list = tabModules(mod.tab);
  return list.length > 0 && list[list.length - 1].id === mod.id;
}

/* ---------- 各 Tab（模块）的完成度与汇总报告状态 ---------- */
function tabModules(tabId) { return MODULES.filter(m => m.tab === tabId); }
function tabDoneCount(tabId) { return tabModules(tabId).filter(m => state.results[m.id]).length; }
function tabUnlocked(tabId) {
  const list = tabModules(tabId);
  return list.length > 0 && list.every(m => state.results[m.id]);
}
function tabReportState(tabId) {
  return state.tabReports[tabId] || { unlocked: false, viewed: false };
}
/* 校准：为每个 Tab 写入 { done, total, unlocked, viewed, time }，
   全部完成时解锁；因重做导致回退时重新上锁，并清空已查看标记 */
function syncTabReports() {
  let changed = false;
  TABS.forEach(t => {
    const all = tabModules(t.id).length;
    const done = tabDoneCount(t.id);
    const ok = all > 0 && done === all;

    let e = state.tabReports[t.id];
    if (!e) { e = state.tabReports[t.id] = { done: 0, total: all, unlocked: false, viewed: false, time: null }; changed = true; }

    if (e.done !== done || e.total !== all) { e.done = done; e.total = all; changed = true; }

    if (e.unlocked !== ok) {
      e.unlocked = ok;
      if (ok) { e.time = Date.now(); e.viewed = false; }
      changed = true;
    }
  });
  return changed;
}

/* =====================================================================
 * 4. 计分引擎
 * ===================================================================== */
function scoreOf(mod) {
  const a = answersOf(mod);
  const rev = mod.rev || [];
  let sum = 0;
  a.forEach((v, i) => {
    if (v == null) return;
    if (rev.indexOf(i) < 0) { sum += v; return; }
    const item = mod.items[i];
    const opts = (item && typeof item === "object" && item.opts) ? item.opts : mod.opts;
    const vals = opts.map(o => o[1]);
    const minV = Math.min(...vals), maxV = Math.max(...vals);
    sum += minV + maxV - v;
  });
  return sum;
}
function resultOf(mod) {
  const score = scoreOf(mod);
  const max = mod.items.reduce((s, item) => {
    const opts = (item && typeof item === "object" && item.opts) ? item.opts : mod.opts;
    return s + Math.max(...opts.map(o => o[1]));
  }, 0);
  const r = { score, max, pct: Math.round(score / max * 100), done: true, time: Date.now() };
  r.detail = mod.detail ? mod.detail(answersOf(mod)) : {};
  return r;
}
function currentResult(mod) { return state.results[mod.id] || null; }
function summaryOf(mod, r) {
  if (mod.summary) return mod.summary.call(mod, r);
  return `得分：${r.score} 分 | 结论：${mod.conclude(r).label}`;
}

/* =====================================================================
 * 5. 首页（Tab + 入口卡片）
 * ===================================================================== */
let activeTab = state.tab || "core";

function renderTabs() {
  document.getElementById("tabs").innerHTML = TABS.map(t => {
    const done = tabDoneCount(t.id);
    const all = tabModules(t.id).length;
    const full = done === all;
    return `<button class="tab ${t.id === activeTab ? "active" : ""} ${full ? "full" : ""}" onclick="switchTab('${t.id}')">${full ? "✓ " : ""}${t.name} ${done}/${all}</button>`;
  }).join("");
}

function switchTab(id) {
  activeTab = id; state.tab = id; saveState();
  renderTabs(); renderEntries();
  scrollTabsAfterSwitch();
}

/* 切换 Tab 后：稍微右移，让最左按钮露出右半、最右按钮露出左半，提示前后都还有模块 */
function scrollTabsAfterSwitch() {
  const bar = document.getElementById("tabs");
  const first = bar.firstElementChild;
  if (!first) return;
  const maxLeft = bar.scrollWidth - bar.clientWidth;
  const left = Math.min(first.offsetWidth / 2, maxLeft);
  bar.scrollTo({ left: Math.max(0, left), behavior: "smooth" });
}

function renderEntries() {
  const list = MODULES.filter(m => m.tab === activeTab);
  const cards = list.map(m => {
    const r = state.results[m.id];
    const idx = MODULES.indexOf(m);
    const ans = answersOf(m);
    const started = ans.some(v => v != null);
    let badge, extra;
    if (r) {
      badge = `<span class="badge done">✓ 已完成</span>`;
      extra = `<div class="entry-summary">${escapeHtml(summaryOf(m, r))} · <span class="view-link" onclick="event.stopPropagation();viewResult('${m.id}')">查看结果 →</span></div>`;
    } else if (started) {
      badge = `<span class="badge doing">进行中</span>`;
      extra = `<div class="entry-note">已答 ${answeredCount(m)}/${m.items.length} 题，点击继续</div>`;
    } else {
      badge = `<span class="badge">未开始</span>`;
      extra = `<div class="entry-note">${m.note}</div>`;
    }
    return `<button class="entry" onclick="openGuide(${idx})">
      <div class="entry-top">
        <div class="entry-icon" style="background:${m.color}">${m.icon}</div>
        <div class="entry-main">
          <div class="entry-title">${m.name}</div>
          <div class="entry-desc">${m.desc}</div>
        </div>
        <div class="entry-right">${badge}</div>
      </div>
      ${extra}
    </button>`;
  }).join("");

  document.getElementById("entry-list").innerHTML = cards + tabReportCard(activeTab);
}

/* 每个 Tab 底部的本模块汇总报告入口 */
function tabReportCard(tabId) {
  const t = TABS.find(x => x.id === tabId);
  const all = tabModules(tabId).length;
  const done = tabDoneCount(tabId);
  const unlocked = tabUnlocked(tabId);
  const st = tabReportState(tabId);
  if (unlocked) {
    return `<button class="tab-report unlocked" onclick="openTabReport('${tabId}')">
      <div class="tr-icon">🗂️</div>
      <div class="tr-main">
        <div class="tr-title">查看本模块汇总报告</div>
        <div class="tr-desc">${t.name} ${all} 项已完成${st.viewed ? " · 已生成过，可随时回看" : " · 已解锁"}</div>
      </div>
      <div class="tr-badge">${st.viewed ? "已查看" : "可查看 →"}</div>
    </button>`;
  }
  return `<button class="tab-report" onclick="tabLocked('${tabId}')">
    <div class="tr-icon">🔒</div>
    <div class="tr-main">
      <div class="tr-title">本模块汇总报告</div>
      <div class="tr-desc">完成${t.name}全部 ${all} 项后解锁（已完成 ${done}/${all}）</div>
      <div class="tr-mini-bar"><div class="tr-mini-fill" style="width:${Math.round(done / all * 100)}%"></div></div>
    </div>
    <div class="tr-badge">${done}/${all}</div>
  </button>`;
}

function renderHomeProgress() {
  const done = MODULES.filter(m => state.results[m.id]).length;

/* =====================================================================
 * 6. 引导页 / 答题
 * ===================================================================== */
let curMod = null;
let curQ = 0;

function switchScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0, 0);
}

function openGuide(idx) {
  curMod = MODULES[idx];
  const g = curMod.guide;
  document.getElementById("g-em").textContent = curMod.icon;
  document.getElementById("g-title").textContent = g.title;
  document.getElementById("g-tag").textContent = g.tag + " · " + curMod.note;
  document.getElementById("g-info").innerHTML = `
    <div class="info-cell"><div class="num">${curMod.items.length}</div><div class="lb">题目数</div></div>
    <div class="info-cell"><div class="num">${curMod.time}</div><div class="lb">分钟（预估）</div></div>
    <div class="info-cell"><div class="num">${state.results[curMod.id] ? "✓" : answeredCount(curMod)}</div><div class="lb">${state.results[curMod.id] ? "已完成" : "已答题"}</div></div>`;
  document.getElementById("g-body").innerHTML = g.body;

  const btn = document.getElementById("g-start");
  const partial = !state.results[curMod.id] && answeredCount(curMod) > 0;
  btn.textContent = partial ? `继续答题（第 ${firstUnanswered(curMod) + 1} 题）` : "开始测试";
  btn.onclick = () => startQuiz(partial);

  /* 单个测试「重新测试」：仅在本测试已有进度或结果时显示，清空后从头开始 */
  const retest = document.getElementById("g-retest");
  const hasState = answeredCount(curMod) > 0 || !!state.results[curMod.id];
  retest.style.display = hasState ? "block" : "none";
  retest.onclick = () => {
    if (!confirm("确定要清空本测试的答案与结果，重新开始吗？")) return;
    startQuiz(false);
  };

  switchScreen("s-guide");
}

function startQuiz(resume) {
  curQ = resume ? firstUnanswered(curMod) : 0;
  if (!resume) {
    state.answers[curMod.id] = new Array(curMod.items.length).fill(null);
    delete state.results[curMod.id];
    saveState();
  }
  renderQuestion();
  switchScreen("s-quiz");
}

function renderQuestion() {
  const mod = curMod, total = mod.items.length;
  document.getElementById("q-mname").textContent = mod.name;
  document.getElementById("q-cur").textContent = curQ + 1;
  document.getElementById("q-total").textContent = total;
  document.getElementById("q-bar").style.width = (curQ / total * 100) + "%";
  document.getElementById("q-index").textContent = `第 ${curQ + 1} 题 / 共 ${total} 题`;

  const text = mod.items[curQ];
  document.getElementById("q-text").textContent = typeof text === "string" ? text : text.q;

  const hint = document.getElementById("q-hint");
  if (mod.id === "wurs" && curQ === 0) {
    hint.style.display = "block";
    hint.textContent = "💡 请回想你 8-12 岁时的状态，而不是现在。";
  } else if (typeof text === "object" && text.hint) {
    hint.style.display = "block"; hint.textContent = "💡 " + text.hint;
  } else { hint.style.display = "none"; }

  const ex = document.getElementById("q-ex");
  if (typeof text === "object" && text.ex) {
    ex.style.display = "block"; ex.textContent = "例：" + text.ex;
  } else { ex.style.display = "none"; }

  const a = answersOf(mod);
  const wrap = document.getElementById("options");
  wrap.innerHTML = "";
  const opts = (typeof text === "object" && text.opts) ? text.opts : mod.opts;
  opts.forEach(([label, v], i) => {
    const b = document.createElement("button");
    b.className = "opt" + (a[curQ] === v ? " picked" : "");
    b.innerHTML = `<span class="dot"></span><span>${label}</span>`;
    b.onclick = () => pick(v, b);
    wrap.appendChild(b);
  });

  document.getElementById("q-back").style.visibility = curQ === 0 ? "hidden" : "visible";
}

function pick(value, btn) {
  const mod = curMod;
  answersOf(mod)[curQ] = value;
  saveState();                       // 每题自动存档
  document.querySelectorAll(".opt").forEach(b => b.classList.remove("picked"));
  btn.classList.add("picked");
  setTimeout(() => {
    if (curQ < mod.items.length - 1) {
      curQ++; renderQuestion();
    } else {
      finishQuiz();
    }
  }, 200);
}

function goBack() { if (curQ > 0) { curQ--; renderQuestion(); } }

function finishQuiz() {
  const mod = curMod;
  const r = resultOf(mod);
  state.results[mod.id] = r;
  saveState();
  renderResult(mod, r);
  switchScreen("s-result");
}

/* =====================================================================
 * 7. 单项结果页
 * ===================================================================== */

function renderResult(mod, r) {
  const concl = mod.conclude(r);
  document.getElementById("r-em").textContent = concl.emoji;
  document.getElementById("r-title").textContent = concl.label;
  document.getElementById("r-score").innerHTML = mod.id === "dsm"
    ? `注意 <strong>${r.detail.att}/9</strong> · 多动 <strong>${r.detail.hyp}/9</strong>`
    : `得分 <strong>${r.score}</strong> / ${r.max}`;
  document.getElementById("r-interpret").innerHTML = mod.interpret(r);

  /* 本 Tab 是否已全部完成 → 提示可查看模块汇总报告 */
  const note = document.getElementById("r-tabnote");
  const lastInModule = isLastInModule(mod);
  if (lastInModule && tabUnlocked(mod.tab)) {
    // 主按钮已是「查看本模块汇总报告」，这里只做一行完成提示，避免重复
    const t = TABS.find(x => x.id === mod.tab);
    note.innerHTML = `<div class="entry-note" style="text-align:center;margin-top:12px;">✅ ${t.name} ${tabModules(mod.tab).length} 项已全部完成</div>`;
  } else if (tabUnlocked(mod.tab)) {
    const t = TABS.find(x => x.id === mod.tab);
    note.innerHTML = `<button class="tab-unlock-note" onclick="openTabReport('${mod.tab}')">
      <span class="ic">🗂️</span>
      <span class="tx">
        <span class="t1">${t.name} ${tabModules(mod.tab).length} 项已全部完成</span>
        <span class="t2">本模块的联动结果已经可以汇总查看</span>
      </span>
      <span class="go">查看 →</span>
    </button>`;
  } else {
    const t = TABS.find(x => x.id === mod.tab);
    note.innerHTML = `<div class="entry-note" style="text-align:center;margin-top:12px;">${t.name}进度 ${tabDoneCount(mod.tab)}/${tabModules(mod.tab).length} · 全部完成后可查看本模块汇总报告</div>`;
  }

  document.getElementById("r-retry").onclick = () => {
    state.answers[mod.id] = new Array(mod.items.length).fill(null);
    delete state.results[mod.id];
    saveState();
    curMod = mod; startQuiz(false);
  };

  /* 结果页主按钮：非本模块最后一个 →「下一个测试」；本模块最后一个 →「查看本模块汇总报告」 */
  const nextBtn = document.getElementById("r-next");
  if (lastInModule) {
    if (tabUnlocked(mod.tab)) {
      nextBtn.style.display = "block";
      nextBtn.textContent = "查看本模块汇总报告";
      nextBtn.onclick = () => openTabReport(mod.tab);
    } else {
      nextBtn.style.display = "none";
    }
  } else {
    const next = nextInModule(mod);
    nextBtn.style.display = "block";
    nextBtn.textContent = `下一个测试：${next.name}`;
    nextBtn.onclick = () => openGuide(MODULES.indexOf(next));
  }
}

function viewResult(id) {
  const mod = byId(id), r = state.results[id];
  if (!mod || !r) return;
  curMod = mod;
  renderResult(mod, r);
  switchScreen("s-result");
}

/* =====================================================================
 * 7.5 模块（Tab）汇总报告
 *     - 每个 Tab 全部完成后解锁，只汇总本模块内量表的联动结果
 *     - 报告状态记录在 state.tabReports[tabId] = { unlocked, viewed, time }
 * ===================================================================== */
function rsec(title, html, cls) {
  return `<div class="sec ${cls || ""}"><div class="sec-title">${title}</div>${html}</div>`;
}

/* 首页/报告用的紧凑摘要 */
function shortSummary(m, r) {
  if (!r) return "未完成";
  const l = m.conclude(r).label;
  switch (m.id) {
    case "asrs":   return `${l} · ${r.score}/${r.max} 分 · 核心 ${r.detail.core}/6`;
    case "wurs":   return `${l} · ${r.score} 分（36 分线）`;
    case "dsm":    return `${l} · 注意 ${r.detail.att}/9 · 多动 ${r.detail.hyp}/9`;
    case "phq9":   return `${l} · ${r.score}/27 分`;
    case "gad7":   return `${l} · ${r.score}/21 分`;
    case "cptsd":  return `${l} · ${r.score}/40 分`;
    case "mdq":    return `${l} · ${r.detail.yes}/13 项是`;
    case "msi":    return `${l} · ${r.score}/10 分`;
    case "psqi":   return `${l} · ${r.score}/27 分`;
    case "tas":    return `${l} · ${r.score}/100 分`;
    case "catq":   return `${l} · ${r.score}/30 分`;
    case "brief":  return `${l} · 总负荷 ${r.detail.total}/30`;
    case "aq":     return `${l} · ${r.score}/112 分`;
    default:       return `${l} · ${r.score}${r.max ? "/" + r.max : ""} 分`;
  }
}

function tabStatList(tabId) {
  return tabModules(tabId).map(m => {
    const r = state.results[m.id];
    return `<div class="stat-row"><span class="sr-name">${m.icon} ${m.name}</span><span class="sr-val">${escapeHtml(shortSummary(m, r))}</span></div>`;
  }).join("");
}

/* ---------------- Tab 1 核心筛查 ---------------- */
function buildCoreReport() {
  const R = state.results;
  const A = R.asrs, W = R.wurs, D = R.dsm, Q = R.aq;
  const iaPct = Math.round(A.detail.ia / A.detail.iaMax * 100);
  const hiPct = Math.round(A.detail.hi / A.detail.hiMax * 100);
  const core = A.detail.core;
  const asrsHigh = core >= 4;
  const wursSig = W.score >= 36;
  const dsmType = byId("dsm").conclusionByDetail(D.detail);
  const dsmSig = dsmType !== "症状不明显";
  const aqHigh = Q.score >= 65;

  /* ① 联动定性 */
  let label, nature;
  if (asrsHigh && wursSig) {
    label = "核心线索高度一致";
    nature = `你近半年的症状频率达到了 ASRS 的提示线（核心题 ${core}/6），童年回溯也在 36 分以上（${W.score} 分）。<strong>现在明显、小时候也明显，是临床判断里最关键的一组信号</strong>，它正好对应 ADHD 作为神经发育障碍的核心要求：症状必须从童年延续而来，而不是成年后突然出现。`;
  } else if (asrsHigh && !wursSig) {
    label = "当前症状明显，童年线索不足";
    nature = `近半年的频率达到了提示线（核心题 ${core}/6），但童年回溯只有 ${W.score} 分。这通常有两种解释：一是童年确实没有明显症状，那当前的注意力问题更可能与压力、情绪或睡眠有关；二是童年症状其实存在，只是以走神、拖延、丢三落四这类安静的形式呈现，被懂事和过得去的成绩掩盖了，这种情况在女性身上更常见。无论哪种情况，ADHD 的诊断都要求症状在 12 岁前就已存在，只是当时可能没有被识别出来。`;
  } else if (!asrsHigh && wursSig) {
    label = "童年特征明显，当前相对平稳";
    nature = `童年回溯 ${W.score} 分（≥36），说明这些特征在 8-12 岁就已经清晰存在；但近半年的频率没有达到 ASRS 提示线（核心题 ${core}/6）。这种情况常见于已经用清单、提醒、截止期限把生活撑住的人，并非症状消失，而是被外部结构接住了。`;
  } else if (dsmSig) {
    label = "条目部分符合，强度未达阈值";
    nature = `DSM-5 条目核对达到了 <strong>${dsmType}</strong> 的标准，但 ASRS 的频率（核心题 ${core}/6）与童年回溯（${W.score} 分）都不算高。这类相似但不够典型的情况，恰恰是最需要医生结合功能损害来判断的灰色地带。`;
  } else {
    label = "核心线索有限";
    nature = `三个核心量表的得分都没有达到各自的提示线：ASRS 核心题 ${core}/6、WURS ${W.score} 分、DSM-5 ${dsmType}。目前没有足够线索支持 ADHD 的判断，但这不等于你的困扰是假的。`;
  }

  /* ② 时间轴 */
  let timeline;
  if (asrsHigh && wursSig) {
    timeline = `两个时间点上都出现了信号，说明这不是最近才有的状态波动，而是<strong>伴随你很久的模式</strong>。这也是为什么 ADHD 的判断不能只看最近累不累；起病时间往往比当下强度更有说服力。`;
  } else if (asrsHigh) {
    timeline = `只有当下亮起了灯。要判断是不是 ADHD，还需要回答一个问题：<strong>12 岁前是否也有类似表现？</strong>如果童年完全没有，医生更可能先考虑情绪、睡眠或压力因素。`;
  } else if (wursSig) {
    timeline = `只有童年亮起了灯。很多人成年后靠大量外部支架把症状压低了，强度下降但底层机制并没有变，这也解释了为什么我小时候很吃力，现在好像还行。`;
  } else {
    timeline = `两个时间点都没有明显信号。如果你仍然觉得日常很吃力，问题可能不在注意力本身，而在情绪负荷、睡眠质量，或者当前环境的要求已经超出了可承受范围。`;
  }

  /* ③ 症状形态 */
  let shape = `<p>ASRS 两个维度：注意力缺陷 <strong>${A.detail.ia}/${A.detail.iaMax}</strong>（${iaPct}%）、多动冲动 <strong>${A.detail.hi}/${A.detail.hiMax}</strong>（${hiPct}%）。`;
  if (iaPct - hiPct >= 10) shape += `你的困扰<strong>主要集中在注意力一侧</strong>：分心、粗心、拖延、事情开了头却收不了尾。这类安静的 ADHD最容易被误读成懒、不用心、态度问题。`;
  else if (hiPct - iaPct >= 10) shape += `你的困扰<strong>主要集中在多动冲动一侧</strong>：坐不住、内心焦躁、容易抢话、凭冲动做决定。成年后外显的乱动往往转成脑子停不下来。`;
  else shape += `两侧强度接近，说明<strong>分心与冲动是同时在起作用的</strong>，它们会互相放大：一分心就容易冲动，一冲动又带来更多混乱。`;
  shape += `</p>`;
  shape += `<p>DSM-5 条目核对结果：<strong>${dsmType}</strong>（注意 ${D.detail.att}/9 · 多动 ${D.detail.hyp}/9）。`;
  if (dsmType === "ADHD-C型") shape += `两个维度都达标，与上面两侧接近的判断相互印证。`;
  else if (dsmType === "ADHD-I型") shape += `以注意力条目为主，与多动冲动相对轻微的表现一致，属于最容易被漏诊的一型。`;
  else if (dsmType === "ADHD-HI型") shape += `以多动冲动条目为主，这种类型在成年后更容易表现为烦躁、急躁而非明显乱动。`;
  else shape += `条目层面尚未达标，说明症状的数量不够，但你在频率上的主观困扰仍然值得被认真对待。`;
  shape += `</p>`;

  /* ④ ASD 叠加 */
  const asd = aqHigh
    ? `<p>AQ-Short <strong>${Q.score} 分</strong>（≥65），提示同时存在较多 ASD 特质。当 ADHD 与 ASD 并存（AuDHD）时，两者常常<strong>互相掩盖</strong>：ADHD 带来混乱与冲动，ASD 对秩序的需求又把它压回去，外人看到的是还行，你自己感受到的是持续内耗。</p>
       <p class="small">这类组合在女性中尤其容易被漏诊，社交伪装会把两边的痕迹一起磨平。</p>`
    : `<p>AQ-Short <strong>${Q.score} 分</strong>，未达到 65 分的提示线，ASD 特质整体不突出，用单一的 ADHD 框架来解释会更简洁。</p>
       <p class="small">不过量表覆盖有限：如果你在社交中长期像在演，或对声音、光线格外敏感，仍值得单独关注。</p>`;

  /* ⑤ 下一步 */
  const next = (asrsHigh || wursSig || dsmSig)
    ? `<p>如果这些困扰确实影响到了工作、学习或关系，<strong>可以把这一页连同三个单项结果一起带去正规医院</strong>（精神科或心理科，具体科室视医院设置而定）。医生最想看的正是这三样：当下的频率、童年的起点、具体的场景。</p>
       <p>如果暂时不打算就医，建议先把模块三（情绪）与模块四（睡眠）补上，<strong>在排除抑郁、焦虑和睡眠不足之前，任何 ADHD 判断都只能算待定</strong>，因为这三者都会直接制造出几乎一样的注意力问题。</p>`
    : `<p>目前线索有限，不必急着给自己贴标签。但量表没达标和我并不难受是两件事。如果你确实长期吃力，优先去看情绪与睡眠（模块三、模块四）。</p>
       <p>也可以先做模块二的执行功能拆解，它不依赖诊断，能直接告诉你卡在任务启动、工作记忆还是情绪控制上。</p>`;

  const html =
    rsec("📊 本模块数据", tabStatList("core")) +
    rsec("① 联动定性", `<p>${nature}</p><p class="small">综合结论：<strong>${label}</strong></p>`) +
    rsec("② 时间轴：当下 × 童年", `<p>${timeline}</p>`) +
    rsec("③ 症状形态：注意 vs 多动", shape) +
    rsec("④ 神经多样性叠加", asd) +
    rsec("⑤ 下一步", next, "safe");

  return { emoji: "🗂️", sub: `${label} · 4 个量表的联动解读`, html: html + INSURANCE_CLOSE };
}

/* ---------------- Tab 2 深度功能 ---------------- */
function buildDeepReport() {
  const R = state.results;
  const B = R.brief, C = R.catq, T = R.tas;
  const total = B.detail.total;
  const execHigh = total / 15 >= 1.2;
  const maskHigh = C.score >= 18;
  const alexi = T.score >= 61;

  let label, nature;
  if (execHigh && maskHigh) {
    label = "高负荷伪装型";
    nature = `你的执行功能三个维度加起来 <strong>${total}/30</strong>，同时社交伪装（CAT-Q ${C.score}/30）的信号也偏高。这是最容易被低估的一种组合：<strong>外面看起来一切正常，维持正常本身耗掉了大部分力气</strong>。别人以为你只是有点累，其实你是在用双倍的成本完成单倍的事。`;
  } else if (execHigh) {
    label = "执行功能负荷偏高";
    nature = `三个维度合计 <strong>${total}/30</strong>，执行功能的负荷明显偏高；但社交伪装的信号不算强（CAT-Q ${C.score}/30）。也就是说，你的困难比较外显，这未必是坏事，别人更容易看到、也更容易理解你的处境。`;
  } else if (maskHigh) {
    label = "外显正常，内耗偏高";
    nature = `执行功能整体负荷不高（<strong>${total}/30</strong>），但社交伪装（CAT-Q ${C.score}/30）的信号明显。你常年在用额外心力维持看起来没问题，<strong>疲惫感往往比症状本身更折磨人</strong>，也很容易被误判为单纯的抑郁或内向。`;
  } else {
    label = "深度功能负荷较低";
    nature = `三项指标都落在较低区间（执行负荷 ${total}/30、伪装 ${C.score}/30、述情 ${T.score}/100）。本模块没有发现明显的执行功能或伪装负担，你的日常运转大概是比较省力的。`;
  }

  /* ② BRIEF 三维度 */
  const dims = BRIEF_DIMS.map((n, i) =>
    `<div class="dim"><div class="dim-row"><span>${n}</span><strong>${B.detail.scores[i]}/10</strong></div>
     <div class="dim-bar"><div class="dim-fill" style="width:${B.detail.scores[i] * 10}%"></div></div></div>`).join("");
  const weakMap = {
    "任务启动": "对你来说，最费劲的不是做，而是开始，启动这一步像有一堵墙。拖延大多卡在这里，而不是懒。",
    "工作记忆": "信息在脑子里存不住：听完就忘、做到一半忘了下一步。这不是记性差，而是工作记忆这张便签纸太小。",
    "情绪控制": "情绪的反应速度和强度都偏高，小事也能点着火，事后又容易懊悔。这会让计划在关键时刻被打断。"
  };
  const execBlock = `<div style="margin:8px 0 4px;">${dims}</div>
    <p>最薄弱的环节是 <strong>${B.detail.weakest}</strong>。${weakMap[B.detail.weakest]}</p>`;

  /* ③ 社交伪装的代价 */
  let cost;
  if (maskHigh) {
    cost = `<p>CAT-Q <strong>${C.score}/30</strong>，提示你在社交中投入了明显的伪装成本：你学会了用合适的表情、语气、话题让自己不被看穿，代价是每一次社交都变成一场需要全神贯注的表演，结束后只想瘫着。</p>
      <p>这不是意志力的问题。伪装本质是一种保护。长期如此，常见的后果是社交后极度疲惫、越来越回避场合，以及他们喜欢的是我演出来的那个人的疏离感。</p>`;
  } else {
    cost = `<p>社交伪装（CAT-Q ${C.score}/30）处在较低区间。你大概不需要每天花大量心力去维持正常，这在应对其他压力时是很大的优势。</p>`;
  }

  /* ④ 述情障碍 */
  const alexiBlock = alexi
    ? `<p>TAS-20 <strong>${T.score} 分</strong>（≥61），提示明显的述情障碍：情绪常常处在说不清的状态，你能感到难受，却很难命名它、也很难向别人解释。</p>
       <p>这会让身边的人误以为你冷淡或无所谓，也让你更难及时发现自己已经撑太久了。情绪不是消失了，而是堆积到某个临界点，才以爆发或崩溃的形式出现。</p>`
    : `<p>TAS-20 <strong>${T.score} 分</strong>，未达到 61 分的提示线，你识别和表达情绪的能力基本在线。这在需要向医生描述自己状态时，是很有帮助的一项能力。</p>`;

  /* ⑤ 建议 */
  const next = `<p>Deep 这一层最有价值的用法不是再确认一次自己有病，而是<strong>找到一个可以只改一件事的入口</strong>：</p>
    <p>① 针对 <strong>${B.detail.weakest}</strong> 设计外部支架，而不是靠决心，把启动动作拆到极小、把记忆外包给便签与提醒、在情绪爆发前设一个物理暂停。</p>
    <p>② 如果伪装信号明显，先做<strong>去伪装化</strong>：从最安全的一两个关系开始，允许自己说我没听懂、允许提前离场、允许沉默，并给社交后的自己留出固定的恢复时间。</p>
    <p>③ 如果述情障碍明显，可以从最简单的练习开始：每天写下三个词形容当天的感受。词汇量是可以练出来的，练出来之后，求助也会变得容易。</p>`;

  const html =
    rsec("📊 本模块数据", tabStatList("deep")) +
    rsec("① 一句话画像", `<p>${nature}</p><p class="small">综合结论：<strong>${label}</strong></p>`) +
    rsec("② 执行功能：你最薄弱的一环", execBlock) +
    rsec("③ 社交伪装的代价", cost) +
    rsec("④ 情绪的识别与表达", alexiBlock) +
    rsec("⑤ 最小可行调整", next, "safe");

  return { emoji: "🧠", sub: `${label} · 执行功能与内耗结构`, html: html + INSURANCE_CLOSE };
}

/* ---------------- Tab 3 共病与情绪 ---------------- */
function buildComorbidReport() {
  const R = state.results;
  const P = R.phq9, G = R.gad7, C = R.cptsd, M = R.mdq, S = R.msi;
  const flags = [];
  if (P.score >= 10) flags.push(`抑郁 ${P.score}/27`);
  if (G.score >= 10) flags.push(`焦虑 ${G.score}/21`);
  if (C.score >= 20) flags.push(`创伤相关反应 ${C.score}/40`);
  const heavy = flags.length > 0;
  const veryHeavy = P.score >= 15 || G.score >= 15 || C.score >= 30;

  let label;
  if (veryHeavy) label = "情绪负荷偏高，建议优先处理";
  else if (heavy) label = "情绪负荷中等偏高";
  else if (P.score >= 5 || G.score >= 5 || C.score >= 10) label = "存在轻度情绪困扰";
  else label = "情绪整体平稳";

  /* ① 总体 */
  let overall;
  if (veryHeavy) {
    overall = `你的情绪筛查出现了多项明显升高（${flags.join("、")}）。在这样的状态下，<strong>任何关于注意力的结论都不可靠</strong>，抑郁会抽走动力与专注，焦虑会占满工作记忆，创伤相关反应会让人长期处在警觉与耗竭中。这三者都能单独制造出像 ADHD的表现。`;
  } else if (heavy) {
    overall = `你的部分情绪指标超过了常用分界值（${flags.join("、")}）。目前还不到严重程度，但已经足以影响睡眠、注意力和工作效率，也足以让 ADHD 的判断变得模糊。`;
  } else if (P.score >= 5 || G.score >= 5 || C.score >= 10) {
    overall = `目前几项情绪筛查都在轻度区间（抑郁 ${P.score}/27、焦虑 ${G.score}/21、创伤相关 ${C.score}/40），没有达到需要优先干预的分界值，但也不是完全无感的状态。`;
  } else {
    overall = `几项情绪筛查都在低区间（抑郁 ${P.score}/27、焦虑 ${G.score}/21、创伤相关 ${C.score}/40）。这意味着你的注意力问题<strong>更可能不是情绪造成的</strong>，如果你在核心筛查里得分偏高，这一条反而增加了 ADHD 解释的可信度。`;
  }

  /* ② 三者如何伪装成 ADHD */
  const disguise = `<p>抑郁的核心是<strong>动力与快感缺失</strong>：不想动、起不来、注意力散，看起来和 ADHD 的拖延、启动困难几乎一样。</p>
    <p>焦虑的核心是<strong>工作记忆被占用</strong>：脑子转个不停、坐不住、静不下来，看起来和多动冲动几乎一样。</p>
    <p>创伤相关反应的核心是<strong>长期警觉与耗竭</strong>：难以集中、易惊、情绪起伏，同样会模仿 ADHD。</p>
    <p class="small">所以临床上的常见顺序是：先稳住情绪 4-6 周，再看注意力还剩多少问题。如果情绪改善后注意力依旧差，ADHD 的可能性才真正上升。</p>`;

  /* ③ 波动与冲动 */
  let volatility = "";
  if (M.detail.yes >= 7 && M.detail.combined) {
    volatility += `<p><span class="mini-tag">情绪波动</span>MDQ 有 <strong>${M.detail.yes}/13</strong> 项符合，且确认这些状态曾同时出现并造成困扰，提示存在<strong>双相谱系风险</strong>。这一条很关键：双相与 ADHD 的部分表现（话多、精力旺、冲动）高度相似，但处理方式完全不同，若被当作单纯 ADHD 处理可能带来风险。就诊时请主动告知医生，并尽量记录情绪波动的周期。</p>`;
  } else {
    volatility += `<p><span class="mini-tag">情绪波动</span>MDQ 符合 ${M.detail.yes}/13 项，未达到提示阈值，暂未发现明显的周期性高涨期。</p>`;
  }
  if (S.score >= 7) {
    volatility += `<p><span class="mini-tag">情绪痛苦</span>MSI-BPD <strong>${S.score}/10</strong>，达到常用的高风险提示线。需要说清楚：这些条目描述的不是人格有问题，而是<strong>一个人在长期情绪痛苦中发展出的自我保护模式</strong>，用强烈反应留住关系、用冲动缓解难以忍受的内心、用抽离隔开痛苦。它们曾经保护过你，只是现在代价越来越高。</p>`;
  } else if (S.score >= 4) {
    volatility += `<p><span class="mini-tag">情绪痛苦</span>MSI-BPD ${S.score}/10，存在部分相关体验，但未到高风险区间。情绪波动本身是可以被理解和改善的。</p>`;
  }

  /* ④ 安全与下一步 */
  let safety = "";
  if (P.detail.selfHarm > 0) {
    safety += `<p>⚠️ 你在 PHQ-9 第 9 题提到过不如死掉或伤害自己的念头。<strong>请优先照顾自己的安全</strong>：联系身边信任的人，或拨打当地心理援助热线（如 12356）。你不需要一个人扛，也不需要在状态最差的时候独自做判断。</p>`;
  }
  safety += heavy
    ? `<p>建议把这份结果当作一个提醒：<strong>现在最值得投入的方向是情绪，而不是继续给自己贴上我太懒的标签。</strong>规律作息、减少负荷、必要时寻求专业帮助；如果有条件，优先找一位能同时评估情绪与注意力的医生。</p>`
    : `<p>情绪层面目前不是主要瓶颈。如果你的注意力或执行功能仍有明显困扰，可以把重心放回模块一与模块二。</p>`;
  safety += `<p class="small">如有需要，你可以携带本结果前往正规医院评估（具体科室视医院设置而定）。是否就医取决于你的主观意愿。</p>`;

  const html =
    rsec("📊 本模块数据", tabStatList("comorbid")) +
    rsec("① 情绪总体负荷", `<p>${overall}</p><p class="small">综合结论：<strong>${label}</strong></p>`) +
    rsec("② 它们如何伪装成 ADHD", disguise) +
    rsec("③ 情绪波动与冲动", volatility) +
    rsec("④ 安全与下一步", safety, heavy ? "alert" : "safe");

  return { emoji: "🌧️", sub: `${label} · 5 个筛查的交叉解读`, html: html + INSURANCE_CLOSE };
}

/* ---------------- Tab 4 生理状态 ---------------- */
function buildPhysioReport() {
  const P = state.results.psqi;
  const d = P.detail;
  const bad = P.score >= 8;
  const C = state.results.chrono;

  const label = P.score >= 16 ? "睡眠质量差，已是明显负担"
              : P.score >= 8 ? "睡眠质量偏差，正在拖累白天"
              : P.score >= 4 ? "轻度睡眠问题"
              : "睡眠状况良好";

  const nature = bad
    ? `<p>PSQI 总分 <strong>${P.score}/27</strong>，最突出的方面是 <strong>${d.worst}</strong>。这不是作息不规律这么轻的一句话，它已经在实质性地削弱你白天的注意力、情绪控制和决策能力。</p>
       <p class="small">三个面向的分布：入睡困难 ${d.fall}/9、睡眠效率 ${d.eff}/9、日间功能 ${d.day}/9。</p>`
    : `<p>PSQI 总分 <strong>${P.score}/27</strong>，整体睡眠状况尚可，暂未表现出明显的睡眠障碍信号（入睡困难 ${d.fall}/9、睡眠效率 ${d.eff}/9、日间功能 ${d.day}/9）。</p>
       <p class="small">如果你仍然觉得白天精力不足，可以留意是否存在睡眠时长够但质量差的情况，例如打鼾、夜间频繁醒来、或睡前长时间刷手机。</p>`;

  const mechanism = `<p>睡眠不足对大脑的影响，恰好落在 ADHD 最典型的那几个区域：<strong>前额叶</strong>。它负责注意力维持、冲动控制、计划与组织，一旦睡眠被压缩，这三项会同时打折。</p>
    <p>所以一个长期睡不好的人，做 ADHD 量表时很可能假阳性：不是他真的有多动症，而是他的大脑在用缺觉的状态答题。反过来说，<strong>如果睡眠修好之后注意力依旧差，那才是更值得重视的信号</strong>。</p>`;

  const plan = `<p>在所有干预里，<strong>睡眠的性价比最高</strong>。不需要一次全改，先从这四件做起，坚持两周通常就能感到差别：</p>
    <p>① <strong>固定起床时间</strong>（比固定入睡更有效），周末也尽量不差超过 1 小时。</p>
    <p>② <strong>起床后 30 分钟内见光</strong>，拉开窗帘、出门走 10 分钟，比任何补剂都管用。</p>
    <p>③ <strong>把床只留给睡觉</strong>，不在床上刷手机、工作、吃饭。让大脑重新建立床＝睡的连接。</p>
    <p>④ <strong>下午之后不摄入咖啡因</strong>，睡前 1 小时把屏幕调暗或换成纸书。</p>`;

  const doctor = `<p>如果出现以下情况，建议优先看睡眠专科或呼吸科，而不是先看注意力：<strong>家人反映你打鼾严重或呼吸暂停</strong>、持续一个月以上难以入睡、白天困到影响开车或工作安全。</p>
    <p class="small">睡眠问题被解决后，很多像 ADHD的表现会自行消退，这也是临床评估前通常会先排查睡眠的原因。</p>`;

  const chrono = C.score >= 18
    ? `<p>rMEQ 得分 <strong>${C.score}</strong>（范围 4–24），提示你属于<strong>晨型</strong>：早上状态更好、起床较早，作息相对靠前。</p>`
    : C.score >= 12
      ? `<p>rMEQ 得分 <strong>${C.score}</strong>（范围 4–24），提示你属于<strong>中间型</strong>：没有特别明显的晨型或夜型倾向，作息相对灵活。</p>`
      : `<p>rMEQ 得分 <strong>${C.score}</strong>（范围 4–24），提示你属于<strong>夜型</strong>：晚上精力更好、早上起床困难。这种睡眠时相偏晚在 ADHD 人群中很常见，若作息越漂越晚、又被迫早起，会长期处于睡眠不足、拖累注意力和情绪。</p>`;

  const html =
    rsec("📊 本模块数据", tabStatList("physio")) +
    rsec("① 睡眠画像", `${nature}<p class="small">综合结论：<strong>${label}</strong></p>`) +
    rsec("② 睡眠如何制造像 ADHD的表现", mechanism) +
    rsec("③ 睡眠时相：晨型还是夜型", chrono) +
    rsec("④ 两周可执行的清单", plan, "safe") +
    rsec("⑤ 什么时候该看医生", doctor);

  return { emoji: "🌙", sub: `${label} · 睡眠质量与时相`, html: html + INSURANCE_CLOSE };
}

const TAB_REPORTS = {
  core: buildCoreReport,
  deep: buildDeepReport,
  comorbid: buildComorbidReport,
  physio: buildPhysioReport
};

/* 打开某个 Tab 的汇总报告 */
function openTabReport(tabId) {
  if (!tabUnlocked(tabId)) { tabLocked(tabId); return; }
  const t = TABS.find(x => x.id === tabId);
  const rep = TAB_REPORTS[tabId]();

  document.getElementById("tr-em").textContent = rep.emoji;
  document.getElementById("tr-title").textContent = `${t.name}汇总报告`;
  document.getElementById("tr-sub").textContent = rep.sub;
  document.getElementById("tr-body").innerHTML = rep.html;
  document.getElementById("tr-shop").href = SHOP_URL;

  /* 记录已查看，与解锁状态一起写入 localStorage */
  const e = state.tabReports[tabId] || (state.tabReports[tabId] = { unlocked: true, time: Date.now() });
  e.unlocked = true;
  e.viewed = true;
  e.viewedAt = Date.now();
  saveState();

  /* 「下一个模块测试」按钮：跳到下一个模块去测试（生理状态是最后一个，不显示） */
  const mi = TABS.findIndex(x => x.id === tabId);
  const nextModuleTab = TABS[mi + 1];
  const nextModuleBtn = document.getElementById("tr-next-module");
  if (nextModuleTab) {
    nextModuleBtn.style.display = "block";
    nextModuleBtn.onclick = () => { switchTab(nextModuleTab.id); showHome(); };
  } else {
    nextModuleBtn.style.display = "none";
  }

  const allDone = MODULES.every(m => state.results[m.id]);
  const compBtn = document.getElementById("tr-comp");
  compBtn.style.display = allDone ? "block" : "none";
  compBtn.onclick = () => showComprehensive();

  switchScreen("s-tabrep");
}

/* 通用锁定页 */
function lockPage(opts) {
  document.getElementById("l-sub").textContent = opts.sub;
  document.getElementById("l-body").innerHTML = opts.body;
  const btn = document.getElementById("l-btn");
  btn.textContent = opts.btn;
  btn.onclick = opts.action;
  switchScreen("s-locked");
}

/* 某个 Tab 的汇总报告未解锁 */
function tabLocked(tabId) {
  const t = TABS.find(x => x.id === tabId);
  const all = tabModules(tabId).length;
  const done = tabDoneCount(tabId);
  const missing = tabModules(tabId).filter(m => !state.results[m.id]);
  const rows = missing.length
    ? missing.map(m => {
        const started = answeredCount(m) > 0;
        return `<div class="miss-row">${m.icon} ${m.name}<span>${started ? `进行中 ${answeredCount(m)}/${m.items.length}` : "未开始"}</span></div>`;
      }).join("")
    : `<div class="miss-row">全部完成<span>✓</span></div>`;
  lockPage({
    sub: `${t.name} · 已完成 ${done}/${all}`,
    body: `<p class="small muted">完成本模块全部 ${all} 项后，即可生成<strong>${t.name}汇总报告</strong>。还差：</p>
      <div style="margin-top:10px;">${rows}</div>`,
    btn: `返回${t.name}继续测试`,
    action: () => { switchTab(tabId); showHome(); }
  });
}

/* =====================================================================
 * 8. 综合报告
 * ===================================================================== */
function compLocked() {
  const done = MODULES.filter(m => state.results[m.id]).length;
  const rows = MODULES.map(m => {
    const r = state.results[m.id];
    const st = r ? `<span style="color:var(--ok);font-weight:600;">✓ ${escapeHtml(shortSummary(m, r))}</span>`
                 : `<span style="color:var(--t3);">未完成</span>`;
    return `<div style="display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:9px;">
      <span style="flex-shrink:0;">${m.icon} ${m.name}</span><span style="text-align:right;">${st}</span></div>`;
  }).join("");
  const tabOk = TABS.filter(t => tabUnlocked(t.id)).length;
  lockPage({
    sub: `当前进度：${done} / ${MODULES.length} · 模块报告 ${tabOk}/4`,
    body: `<p class="small muted" style="margin-bottom:12px;">终极综合报告需要完成全部 14 项。如果只想先看某一组，可以回到首页查看已解锁的<strong>模块汇总报告</strong>：</p>${rows}`,
    btn: "返回首页继续测试",
    action: () => showHome()
  });
}

function showComprehensive() {
  const R = state.results;
  if (!MODULES.every(m => R[m.id])) { compLocked(); return; }

  const asrs = R.asrs, wurs = R.wurs, dsm = R.dsm, aq = R.aq;
  const phq = R.phq9, gad = R.gad7, cpt = R.cptsd;
  const brief = R.brief, catq = R.catq;
  const tas = R.tas, mdq = R.mdq, msi = R.msi, psqi = R.psqi;

  /* ---- 1. 情绪优先判定 ---- */
  const moodFlags = [];
  if (phq.score >= 10) moodFlags.push(`抑郁 ${phq.score}/27`);
  if (gad.score >= 10) moodFlags.push(`焦虑 ${gad.score}/21`);
  if (cpt.score >= 20) moodFlags.push(`创伤相关反应 ${cpt.score}/40`);
  const moodFirst = moodFlags.length > 0;

  /* ---- 2. ADHD 倾向 ---- */
  const asrsHigh = asrs.detail.core >= 4;
  const wursSig = wurs.score >= 36;
  const dsmLabel = byId("dsm").conclude(dsm).label;
  let adhdTendency;
  if (asrsHigh && wursSig) adhdTendency = { level: 3, text: "高度符合成人 ADHD 特征" };
  else if (asrsHigh || wursSig || dsmLabel.indexOf("ADHD") === 0) adhdTendency = { level: 2, text: "部分符合成人 ADHD 特征" };
  else adhdTendency = { level: 1, text: "ADHD 倾向不明显" };

  /* ---- 3. AuDHD ---- */
  const audhd = adhdTendency.level >= 2 && aq.score >= 65;

  /* ---- 4. 执行卡点 ---- */
  const briefWeak = brief.detail.weakest;

  /* ---- 5. 伪装耗竭 ---- */
  const maskHigh = catq.score >= 18;

  /* ---- 6. 生理 ---- */
  const sleepBad = psqi.score >= 8;

  const body = [];
  const sec = (title, html, cls) =>
    `<div class="sec ${cls || ""}"><div class="sec-title">${title}</div>${html}</div>`;

  /* 构建报告 */
  let h = "";

  if (moodFirst) {
    h += sec("⚠️ 优先级提示：先看情绪",
      `<p>你的情绪筛查得分偏高（${moodFlags.join("、")}）。这一点很重要：<strong>情绪问题本身就会制造出像 ADHD的表现</strong>，注意力涣散、拖延、易怒、坐不住。</p>
       <p>所以在当前阶段，更合理的顺序是<strong>先处理情绪</strong>：规律睡眠、减少负荷、必要时寻求专业帮助；等情绪稳定 4-6 周后，再回头看注意力的问题，判断会准确得多。</p>
       <p class="small">这不代表你的 ADHD 特征一定不存在，只是此刻无法可靠区分。</p>`,
      "alert");
  }

  const allRows = MODULES.map(m => {
    const r = R[m.id];
    const t = TABS.find(x => x.id === m.tab);
    return `<div class="stat-row"><span class="sr-name">${m.icon} ${m.name}<span class="small" style="color:var(--t3);"> · ${t ? t.name : ""}</span></span><span class="sr-val">${escapeHtml(shortSummary(m, r))}</span></div>`;
  }).join("");
  h += sec("📊 各量表结果一览", allRows);

  const verdictExplain = adhdTendency.level === 3
    ? "你的特征在当下和童年两个时间点都明显，符合 ADHD 作为神经发育障碍的典型模式（症状需在 12 岁前出现，并延续到成年）。"
    : adhdTendency.level === 2
      ? "你存在一部分 ADHD 相关特征，但证据还不够完整或典型，需要结合情绪、睡眠和实际功能损害综合判断，不能仅凭分数下结论。"
      : "目前的筛查没有发现明显支持 ADHD 的线索；如果你仍感到吃力，困扰更可能来自情绪、睡眠或环境压力。";

  h += sec("① 综合判定",
    `<p>结合当下状态（ASRS）、童年回溯（WURS）与 DSM-5 条目核对，你的整体画像更接近：<strong>${adhdTendency.text}</strong>。</p>
     <p>${verdictExplain}</p>
     <p class="small">ASRS 核心题达标 ${asrs.detail.core}/6 · WURS ${wurs.score} 分（36 分线）· DSM-5 ${escapeHtml(summaryOf(byId("dsm"), dsm))}</p>
     ${audhd ? `<p><span class="mini-tag">AuDHD</span>同时，你的 ASD 特质得分 ${aq.score} 分（≥65），提示 <strong>AuDHD（ADHD 与 ASD 重叠）</strong>的可能。两者并存时常常互相掩盖：ADHD 带来混乱与冲动，ASD 带来的秩序需求又把它压住，外人更难看出来，你自己也更累。</p>` : ""}`);

  h += sec("② 你的核心卡点",
    `<p><span class="mini-tag">执行功能</span>最薄弱的环节是<strong>${briefWeak}</strong>。这通常是你日常最容易卡住的地方，也最值得优先设计外部支架。</p>
     ${maskHigh ? `<p><span class="mini-tag">伪装耗竭</span>你在社交伪装（CAT-Q ${catq.score}/30）上的信号明显：这些年你一直在用额外的力气维持看起来正常，疲惫不是矫情，是真实的消耗。</p>` : ""}
     ${tas.score >= 61 ? `<p><span class="mini-tag">情绪识别</span>TAS-20 ${tas.score} 分，提示明显的述情障碍：情绪常在说不清的状态里堆积，直到突然爆发。</p>` : ""}
     ${sleepBad ? `<p><span class="mini-tag">睡眠</span>PSQI ${psqi.score}/27，睡眠已经在拖累白天的注意力与情绪控制，这是性价比最高的改善入口。</p>` : ""}
     ${(mdq.detail.yes >= 7 && mdq.detail.combined) ? `<p><span class="mini-tag">情绪波动</span>MDQ 提示存在双相谱系风险。若有周期性高涨期，就诊时请主动告知医生。</p>` : ""}
     ${msi.score >= 7 ? `<p><span class="mini-tag">情绪痛苦</span>MSI-BPD ${msi.score}/10，提示你在强烈情绪中有一套高消耗的应对模式。它曾经保护过你，现在值得换成更省力的方式。</p>` : ""}`);

  const needEval = adhdTendency.level >= 2;
  h += sec("③ 下一步怎么走",
    `<p>${moodFirst
        ? "先处理情绪，再评估注意力。这不是拖延，而是更有效率的顺序。"
        : needEval
          ? "你的特征组合已经比较清晰，如果这些困扰确实影响到了工作、学习或关系，值得做一次正式评估。"
          : "目前的量表结果整体较轻。可以先从睡眠和压力入手，观察 1-2 个月再判断。"}</p>
     <p>如有需要，你可以携带本结果前往正规医院评估（具体科室视医院设置而定）。是否就医取决于你的主观意愿。</p>
     <p class="small">如果决定就诊：把这份报告、童年回溯的结果、以及最困扰你的 3 个具体场景一起带上，会比空手描述有效得多。</p>`,
    "safe");

  h += INSURANCE_CLOSE;

  document.getElementById("c-tabnav").innerHTML = TABS.map(t => tabUnlocked(t.id)
    ? `<span class="chip">🗂️ ${t.name}</span>`
    : `<span class="chip" style="opacity:.45;">🔒 ${t.name}</span>`).join("");

  document.getElementById("c-sub").textContent =
    `${adhdTendency.text}${audhd ? " · AuDHD 重叠可能" : ""}`;
  document.getElementById("c-body").innerHTML = h;
  document.getElementById("c-ad").textContent =
    "看到自己真实的特质只是改变的起点，如何带着这些特质过好每一天才是真正的课题。如果你希望有一份随时能翻阅的实操指南，这本《ADHD人生设计指南》里，有我这些年摸索出的底层框架与应对方法。";
  document.getElementById("c-shop").href = SHOP_URL;
  switchScreen("s-comp");
}

/* =====================================================================
 * 8.5 下载 PDF 报告（打印已完成测试的摘要 + 总结性解析）
 * ===================================================================== */
function pdfSummary(results) {
  const notes = [];
  const dsm = results.dsm;

  // ADHD 核心线索
  if (results.asrs && results.wurs) {
    const asrsHigh = results.asrs.detail.core >= 4;
    const wursSig = results.wurs.score >= 36;
    if (asrsHigh && wursSig) notes.push("ASRS 与 WURS 均提示 ADHD 相关特征，且童年即有迹可循，符合 ADHD 需童年起病的典型模式，可结合功能损害考虑正式评估。");
    else if (asrsHigh) notes.push("当前注意力困扰明显，但童年线索不足，更可能与近期压力、情绪或睡眠有关。");
    else if (wursSig) notes.push("童年特征明显但当前相对平稳，可能已被外部结构或代偿支撑。");
    else notes.push("核心筛查暂未提示明显 ADHD 特征。");
  }
  if (dsm && dsm.detail) {
    const att = dsm.detail.att || 0, hyp = dsm.detail.hyp || 0;
    if (att >= 5 && hyp >= 5) notes.push(`DSM-5 条目核对为混合型（注意 ${att}/9、多动 ${hyp}/9），分心与冲动同时存在。`);
    else if (att >= 5) notes.push(`DSM-5 条目核对以注意力缺陷为主（注意 ${att}/9、多动 ${hyp}/9），较易被误读为懒的安静型表现。`);
    else if (hyp >= 5) notes.push(`DSM-5 条目核对以多动冲动为主（注意 ${att}/9、多动 ${hyp}/9）。`);
  }

  // 共病与情绪
  if (results.phq9 && results.phq9.score >= 10) notes.push(`抑郁筛查为 ${results.phq9.score}/27（中度及以上），情绪可能正在影响注意力和动力，建议优先关注情绪。`);
  if (results.gad7 && results.gad7.score >= 10) notes.push(`焦虑筛查为 ${results.gad7.score}/21（中度及以上），焦虑会占用工作记忆，制造类似 ADHD 的表现。`);
  if (results.cptsd && results.cptsd.score >= 20) notes.push("创伤相关反应较明显，长期警觉与耗竭也会削弱注意力，值得在评估时一并告知医生。");
  if (results.mdq && results.mdq.detail && results.mdq.detail.yes >= 7 && results.mdq.detail.combined) notes.push("MDQ 提示双相谱系风险，就诊时建议主动提及情绪波动的周期。");
  if (results.msi && results.msi.score >= 7) notes.push("MSI-BPD 提示情绪痛苦模式明显，针对情绪调节的疗法（如 DBT）可能更有帮助。");

  // 执行功能与社交
  if (results.brief && results.brief.detail) notes.push(`执行功能最薄弱环节是 ${results.brief.detail.weakest}，可优先为它设计外部支架。`);
  if (results.catq && results.catq.score >= 18) notes.push("社交伪装负担较高，长期维持表面正常带来的耗竭值得被正视。");
  if (results.tas && results.tas.score >= 61) notes.push("述情障碍较明显，情绪常常说不清，可尝试从身体感受入手练习命名。");

  // 生理与神经多样性
  if (results.psqi && results.psqi.score >= 8) notes.push("睡眠质量偏差，正在拖累白天的注意力和情绪控制，属于性价比最高的改善入口。");
  if (results.chrono && results.chrono.score <= 11) notes.push("昼夜节律偏夜型，注意固定起床时间、起床后见光，避免作息越漂越晚。");
  if (results.aq && results.aq.score >= 65) notes.push("孤独谱系特质得分较高，若与 ADHD 同时存在，两者常互相掩盖，需一并考虑。");

  if (!notes.length) {
    return `<p class="pr-summary-title">综合小结</p><p class="pr-empty">目前完成的测试还较少，暂不足以形成整体判断；继续完成更多测试后，这里会给出更完整的总结。</p>`;
  }
  return `<p class="pr-summary-title">综合小结</p>` + notes.map(n => `<p>· ${n}</p>`).join("");
}

/* 在 canvas 上绘制报告，返回 canvas（生成报告图片） */
function renderReportCanvas() {
  const results = state.results;
  const done = MODULES.filter(m => results[m.id]);
  const W = 760, margin = 48;
  const canvas = document.createElement("canvas");
  canvas.width = W;
  const ctx = canvas.getContext("2d");
  const font = (size, bold) => `${bold ? "bold " : ""}${size}px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`;

  const maxW = W - margin * 2;
  const wrap = (text, f) => {
    ctx.font = f;
    const lines = [];
    let line = "";
    for (const ch of Array.from(text)) {
      if (ctx.measureText(line + ch).width > maxW && line) { lines.push(line); line = ch; }
      else line += ch;
    }
    if (line) lines.push(line);
    return lines;
  };

  const paras = [];
  paras.push({ text: "ADHD 与神经多样性自测报告", f: font(34, true), c: "#1f2430", gap: 16 });
  paras.push({ text: `生成时间：${new Date().toLocaleString("zh-CN")} · 已完成 ${done.length}/${MODULES.length} 项`, f: font(22), c: "#5c6470", gap: 26 });
  if (done.length) {
    done.forEach(m => {
      paras.push({ text: `${m.icon} ${m.name}`, f: font(26, true), c: "#1f2430", gap: 4 });
      paras.push({ text: shortSummary(m, results[m.id]), f: font(26), c: "#5c6470", gap: 16 });
    });
  } else {
    paras.push({ text: "尚未完成任何测试。", f: font(26), c: "#5c6470", gap: 16 });
  }
  const summary = pdfSummary(results).replace(/<\/p>/gi, "\n").replace(/<[^>]*>/g, "");
  summary.split("\n").map(s => s.trim()).filter(Boolean).forEach((s, i) => {
    paras.push({ text: s, f: font(26), c: i === 0 ? "#1f2430" : "#5c6470", gap: 8 });
  });
  paras.push({ text: "本报告仅作自我了解与初筛参考，不能替代专业医生的临床诊断。", f: font(20), c: "#9aa1ac", gap: 0 });

  const rendered = paras.map(p => ({ ...p, lines: wrap(p.text, p.f) }));
  const lineH = 46, topPad = 56, bottomPad = 40;
  let h = topPad;
  rendered.forEach(p => { h += p.lines.length * lineH + p.gap; });
  h += bottomPad;
  canvas.height = Math.ceil(h);

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, W, canvas.height);
  let y = topPad;
  rendered.forEach(p => {
    ctx.font = p.f;
    ctx.fillStyle = p.c;
    p.lines.forEach(line => { ctx.fillText(line, margin, y); y += lineH; });
    y += p.gap;
  });
  return canvas;
}

function downloadReportImage() {
  return renderReportCanvas().toDataURL("image/png");
}

function showReportImage() {
  const dataUrl = downloadReportImage();
  document.querySelectorAll(".img-save-mask").forEach(e => e.remove());
  const mask = document.createElement("div");
  mask.className = "img-save-mask";
  mask.innerHTML = `
    <div class="img-save-card">
      <img src="${dataUrl}" alt="测试报告">
      <p class="img-save-hint">长按上方图片，选择「保存图片」即可保存报告。</p>
      <button class="img-save-close" onclick="this.closest('.img-save-mask').remove()">关闭</button>
    </div>`;
  mask.addEventListener("click", e => { if (e.target === mask) mask.remove(); });
  document.body.appendChild(mask);
}

/* ===== 重新测试：清除所有结果 ===== */
function resetTest() {
  if (!confirm("确定要清除所有测试结果，重新开始吗？")) return;
  state.answers = {};
  state.results = {};
  state.tabReports = {};
  state.tab = "core";
  activeTab = "core";
  saveState();
  showHome();
}

/* =====================================================================
 * 9. 工具 & 启动
 * ===================================================================== */
function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* ===== 访问门禁 ===== */
const GATE_PASSWORD = "ZHC-8391";
function gateCheck() {
  const input = document.getElementById("gate-input");
  const err = document.getElementById("gate-error");
  if (input.value.trim() === GATE_PASSWORD) {
    document.getElementById("gate").style.display = "none";
  } else {
    err.textContent = "密码错误，请重试";
    input.value = "";
    input.focus();
  }
}
document.getElementById("gate-btn").addEventListener("click", gateCheck);
document.getElementById("gate-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") gateCheck();
});

/* 首次加载：校准各 Tab 模块报告状态并恢复进度 */
syncTabReports();
saveState();
showHome();
